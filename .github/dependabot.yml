version: 2

# VeroPlugins has no package dependencies - it is a catalog, a shell script and one
# TypeScript file. The only thing that can go stale is the actions the CI workflow pins,
# so that is all this watches.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
